<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{doc_title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
{{css}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="{{hub_file}}">{{brand}} <span>{{brand_sub}}</span></a>
<details class="mnav"><summary>문서 목록</summary>{{side}}</details></header>
<div class="cols">
<aside class="sidecol">{{side}}</aside>
<main>
<header class="head" id="top"><p class="eyebrow">{{eyebrow}}</p><h1>{{title}}{{title_chip}}</h1><p class="lede">{{lede}}</p></header>
<nav class="ontoc" aria-label="이 문서의 목차"><p>이 문서에서</p><ol>{{ontoc}}</ol></nav>
<article>
{{body}}
</article>
<nav class="pn" aria-label="이전·다음 문서">{{prev}}{{next}}</nav>
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js" integrity="sha384-rbtjAdnIQE/aQJGEgXrVUlMibdfTSa4PQju4HDhN3sR2PmaKFzhEafuePsl9H/9I" crossorigin="anonymous"></script>
<script>
(function () {
  if (!window.mermaid) return;
  var cs = getComputedStyle(document.documentElement);
  var v = function (name) { return cs.getPropertyValue(name).trim(); };
  mermaid.initialize({
    startOnLoad: false, theme: 'base', securityLevel: 'strict',
    fontFamily: v('--f-body'),
    themeVariables: {
      primaryColor: v('--accent-soft'), primaryBorderColor: v('--accent'), primaryTextColor: v('--ink'),
      secondaryColor: v('--accent2-soft'), secondaryBorderColor: v('--accent2'), tertiaryColor: v('--panel'),
      lineColor: v('--sub'), textColor: v('--ink'), noteBkgColor: v('--accent2-soft'), noteBorderColor: v('--accent2'),
      actorBkg: v('--accent-soft'), actorBorder: v('--accent'), signalColor: v('--accent'),
      labelBackground: v('--panel'), edgeLabelBackground: v('--panel')
    }
  });
  var els = [].slice.call(document.querySelectorAll('pre.mmd:not([data-processed])'));
  var go = function () { if (els.length) mermaid.run({ nodes: els }).catch(function () {}); };
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(go, go);
})();
</script>
</body></html>
